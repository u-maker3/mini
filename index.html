<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#21152d"><title>何しに来たん。｜帰りたいだけやのに。</title><style>
*{box-sizing:border-box}body{margin:0;background:#21152d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;text-align:center;touch-action:manipulation}.wrap{max-width:520px;margin:auto;padding:16px 14px 32px}h1{font-size:clamp(27px,8vw,40px);margin:16px 0 5px}.sub{color:#e5c9ee;margin:0 0 16px}.panel{background:#352444;border:2px solid #70517e;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 10px 25px #0003}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}button.primary{border:0;border-radius:18px;padding:16px 26px;background:#ffda52;color:#291525;font-size:21px;font-weight:900;width:100%;margin:9px 0}button.secondary{background:#594069;border:1px solid #a98cba;color:white;border-radius:13px;padding:12px 16px;margin:5px}.small{font-size:13px;color:#d4c1dc}.stats{display:flex;gap:8px;justify-content:space-around;margin:10px 0}.stat{flex:1;background:#493356;border-radius:13px;padding:9px 3px}.stat strong{display:block;font-size:24px}.stat span{font-size:12px}.arena{position:relative;height:min(58vh,420px);min-height:315px;border:3px solid #ffda52;border-radius:20px;background:radial-gradient(circle at 50% 40%,#5a3d70,#2a1a38);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}.target{position:absolute;left:0;top:0;min-width:69px;height:63px;border:3px solid white;border-radius:999px;background:#fa5e76;color:white;font-weight:900;font-size:17px;box-shadow:0 5px 0 #a9294c,0 10px 22px #0005;transform:translate(-50%,-50%);transition:left .12s linear,top .12s linear;z-index:2}.target.fake{background:#765f8b;box-shadow:0 4px 0 #443052;font-size:14px;min-width:65px;height:57px}.target.boss{background:#ffb02f;color:#321a14;min-width:100px;height:90px;border-color:#fff0a3;box-shadow:0 7px 0 #bb6a13}.arena-label{position:absolute;left:0;right:0;top:12px;font-weight:900;pointer-events:none;text-shadow:0 2px 5px #000}.toast{min-height:45px;font-weight:bold;color:#ffe17c;margin:10px 0}.hidden{display:none!important}.bar{height:10px;background:#6d557a;border-radius:99px;overflow:hidden}.bar>div{height:100%;width:100%;background:#ffda52;transition:width .1s linear}.result-title{font-size:27px;color:#ffda52}.note{line-height:1.8}.footer{font-size:12px;color:#baa7c5;margin-top:20px}</style></head><body><div class="wrap"><h1>何しに来たん。</h1><p class="sub">〜帰りたいだけやのに。〜</p>
<section id="intro" class="panel"><div style="font-size:65px">🚪🏃💨</div><h2>30秒で帰れると思うなよ。</h2><p class="note">赤い「帰る」をしばいて捕まえろ！<br>灰色はニセモノ。後半はボス乱入！<br>ボスは連打で小さくして追い払え🤣</p><button class="primary" id="start">帰らせてくれ！</button><p class="small">音なし・個人情報送信なし・何回でも遊べる</p></section>
<section id="game" class="hidden"><div class="stats"><div class="stat"><strong id="time">30.0</strong><span>残り秒</span></div><div class="stat"><strong id="hits">0</strong><span>捕獲</span></div><div class="stat"><strong id="miss">0</strong><span>ミス</span></div></div><div class="bar"><div id="timebar"></div></div><p class="toast" id="toast" aria-live="polite">捕まえてみぃ！</p><div class="arena" id="arena"><div class="arena-label" id="phase">LEVEL 1｜逃げる「帰る」</div></div><button class="secondary" id="quit">やっぱりやめる</button></section>
<section id="result" class="panel hidden"><div style="font-size:52px">🏆</div><h2 class="result-title">無駄な努力認定証</h2><h3 id="rank"></h3><p id="summary" class="note"></p><p id="best" class="small"></p><button class="primary" id="save">📸 認定証をPNG保存</button><button class="secondary" id="retry">もう一回しばく</button><button class="secondary" id="home">最初に戻る</button><p class="small" id="savehint">iPhoneでは画像を開いて長押し保存もできるで。</p></section><p class="footer">うめこアプリ工房｜このゲームに意味はありません。</p></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),arena=$('arena');let playing=false,started=0,raf=0,mover=0,targets=[],hits=0,miss=0,bossHits=0,bossActive=false,phase=-1,toastTimer=0;const DURATION=30000;const W=['何しに来たん！','そっちちゃう！','指ついてきてるか？','必死やな🤣','帰らせへんぞ！'];function show(id){['intro','game','result'].forEach(k=>$(k).classList.toggle('hidden',k!==id))}function say(s){$('toast').textContent=s}function clearTargets(){targets.forEach(el=>el.remove());targets=[]}function rand(a,b){return a+Math.random()*(b-a)}function place(el){const r=arena.getBoundingClientRect(),w=el.offsetWidth||76,h=el.offsetHeight||65;el.style.left=rand(w/2+5,Math.max(w/2+6,r.width-w/2-5))+'px';el.style.top=rand(h/2+52,Math.max(h/2+53,r.height-h/2-6))+'px'}function addTarget(fake=false,boss=false){const el=document.createElement('button');el.type='button';el.className='target'+(fake?' fake':'')+(boss?' boss':'');el.textContent=boss?'👹 ボス':fake?'帰る？':'帰る！';arena.appendChild(el);targets.push(el);place(el);el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(!playing)return;if(fake){miss++;$('miss').textContent=miss;say('それニセモノや！🤣');place(el);return}hits++;$('hits').textContent=hits;if(boss){bossHits++;const scale=Math.max(.48,1-bossHits*.09);el.style.scale=String(scale);say(bossHits>=7?'ボス「さいなら〜！」💨':'ボス「やめろやー！」');if(bossHits>=7){bossHits=0;el.style.scale='1';place(el)}}else{say(W[Math.floor(Math.random()*W.length)]);place(el)}});return el}function changePhase(p){if(p===phase)return;phase=p;clearTargets();bossActive=p===4;bossHits=0;const names=['LEVEL 1｜帰るボタンを捕獲','LEVEL 2｜逃げ足アップ','LEVEL 3｜ニセモノ乱入','LEVEL 4｜ニセモノ増殖','FINAL｜ボスを連打で撃退'];$('phase').textContent=names[p];if(p===4){addTarget(false,true);say('ボス乱入！7回連打で追い払え！')}else{addTarget(false,false);for(let i=0;i<(p===2?2:p===3?4:0);i++)addTarget(true,false);say(p===0?'赤い「帰る」を押せ！':p===1?'スピードアップ！': 'ニセモノに気ぃつけや！')}}function move(){if(!playing)return;targets.forEach(el=>{if(Math.random()<.82)place(el)})}function tick(){if(!playing)return;const left=Math.max(0,DURATION-(performance.now()-started));$('time').textContent=(left/1000).toFixed(1);$('timebar').style.width=(left/DURATION*100)+'%';const elapsed=DURATION-left;const p=elapsed<6000?0:elapsed<12000?1:elapsed<18000?2:elapsed<24000?3:4;changePhase(p);if(left<=0){finish();return}raf=requestAnimationFrame(tick)}function start(){stop();playing=true;hits=0;miss=0;phase=-1;bossHits=0;$('hits').textContent='0';$('miss').textContent='0';$('time').textContent='30.0';$('timebar').style.width='100%';show('game');started=performance.now();mover=setInterval(move,430);raf=requestAnimationFrame(tick)}function stop(){playing=false;cancelAnimationFrame(raf);clearInterval(mover);clearTimeout(toastTimer);clearTargets()}function finish(){stop();const score=Math.max(0,hits*10-miss*5);const rank=score>=500?'指先だけアスリート':score>=250?'帰宅への執念が強すぎる人':score>=100?'まあまあ帰りたい人':'まだ玄関にも着いてへん人';$('rank').textContent=rank;$('summary').innerHTML='捕獲 <b>'+hits+'</b> 回 ／ ミス <b>'+miss+'</b> 回<br>得点 <b>'+score+'</b> 点<br><br>「何しに来たん？」<br>……帰りたかっただけやのに。';let best=0;try{best=Number(localStorage.getItem('nanishini_best')||0);if(score>best){best=score;localStorage.setItem('nanishini_best',String(best))}}catch(e){}$('best').textContent='自己ベスト：'+best+'点';show('result');window.lastResult={score,rank,hits,miss,best}}function save(){const r=window.lastResult;if(!r)return;const c=document.createElement('canvas');c.width=900;c.height=1200;const x=c.getContext('2d');x.fillStyle='#261631';x.fillRect(0,0,900,1200);x.strokeStyle='#ffda52';x.lineWidth=14;x.strokeRect(35,35,830,1130);x.textAlign='center';x.fillStyle='#ffda52';x.font='bold 67px sans-serif';x.fillText('無駄な努力認定証',450,200);x.fillStyle='white';x.font='bold 45px sans-serif';x.fillText('何しに来たん。',450,300);x.font='bold 39px sans-serif';x.fillText(r.rank,450,435);x.font='42px sans-serif';x.fillText('捕獲：'+r.hits+' 回',450,565);x.fillText('ミス：'+r.miss+' 回',450,645);x.fillText('得点：'+r.score+' 点',450,725);x.font='33px sans-serif';x.fillText('帰りたかっただけやのに。',450,850);x.fillStyle='#dfc5e7';x.font='26px sans-serif';x.fillText('うめこアプリ工房',450,1060);c.toBlob(blob=>{if(!blob){$('savehint').textContent='画像作成に失敗したで。';return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='何しに来たん_認定証.png';document.body.appendChild(a);a.click();a.remove();$('savehint').textContent='保存されへん場合はSafariで画像を長押ししてな。';setTimeout(()=>URL.revokeObjectURL(url),60000)},'image/png')}$('start').addEventListener('click',start);$('retry').addEventListener('click',start);$('quit').addEventListener('click',finish);$('home').addEventListener('click',()=>{stop();show('intro')});$('save').addEventListener('click',save);arena.addEventListener('pointerdown',e=>{if(e.target===arena&&playing){miss++;$('miss').textContent=miss;say('空振り！🤣')}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)finish()});show('intro');})();
</script></body></html>
