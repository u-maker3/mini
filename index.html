<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#24163c"><title>何しに来たん。｜うめこ</title><style>
:root{--bg:#24163c;--card:#fff9e9;--ink:#30213b;--pink:#ff6d9b;--yellow:#ffe078}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 90% 10%,#6c3584,transparent 38%),radial-gradient(circle at 0 90%,#3e6395,transparent 45%),var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;color:white}.wrap{max-width:560px;margin:auto;padding:22px 16px 45px}.top{text-align:center;font-size:12px;letter-spacing:.16em;color:#e4c5f4}.panel{background:var(--card);color:var(--ink);border:4px solid #1d142a;box-shadow:9px 9px 0 #100c1e;border-radius:25px;padding:23px 17px;margin:20px 0}.title{font-size:clamp(32px,9vw,49px);margin:13px 0;text-align:center;line-height:1.2}.sub{text-align:center;line-height:1.8}.btn{display:block;width:100%;border:3px solid #21182c;border-radius:16px;background:var(--yellow);padding:15px 12px;font-size:18px;font-weight:900;color:#2c2038;box-shadow:4px 4px 0 #21182c;margin:12px 0;cursor:pointer;touch-action:manipulation}.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #21182c}.btn.alt{background:#f6d5e6}.btn.dark{background:#3e2a55;color:white}.muted{color:#675e6b;font-size:13px;line-height:1.7}.center{text-align:center}.big{font-size:76px;text-align:center;line-height:1.5}.stage{font-size:12px;font-weight:bold;color:#765487;letter-spacing:.1em}.question{font-size:24px;line-height:1.5;text-align:center;font-weight:900;margin:16px 0}.message{background:#f1e9ff;border-radius:12px;padding:13px;margin:12px 0;font-weight:700;text-align:center;line-height:1.7}.arena{height:210px;border:2px dashed #aa96bd;border-radius:18px;position:relative;overflow:hidden;background:#fff}.runner{position:absolute;border:0;background:transparent;font-size:54px;cursor:pointer;transition:left .22s,top .22s}.tiny{font-size:12px}.choices{display:grid;gap:5px}.hidden{display:none!important}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f2eafa;border-radius:14px;padding:14px;text-align:center}.stat b{font-size:22px}.footer{text-align:center;font-size:12px;color:#cdb6dc;margin-top:20px}.row{display:flex;gap:10px}.row>*{flex:1}.danger{color:#b53663}.hint{font-size:13px;color:#6a536e;text-align:center}.ghost{border:0;background:transparent;color:#8b759a;text-decoration:underline;font-size:13px;padding:10px;cursor:pointer}.pill{display:inline-block;background:#ebdcff;padding:7px 13px;border-radius:20px;font-size:12px;font-weight:bold}#longPress{user-select:none;-webkit-user-select:none;touch-action:none}canvas{display:none}</style></head><body><main class="wrap"><div class="top">UMEKO PRESENTS • 理解したら負け</div><div id="app"></div><div class="footer">© うめこアプリ工房｜遊びの記録はこの端末内のみ</div></main><canvas id="certificate" width="1080" height="1440"></canvas><script>
'use strict';const app=document.getElementById('app');const KEY='umeko_nanishini_v1';let s={stage:0,taps:0,miss:0,started:0,stageStarted:0,log:[],banana:0,tries:0,clues:[],king:0,finish:false,mode:'normal'};let timer=null,pressTimer=null;const safe=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Number.isInteger(x.stage)&&x.stage>=0&&x.stage<=8)s={...s,...x}}catch(e){}}function elapsed(){return s.started?Math.floor((Date.now()-s.started)/1000):0}function fmt(n){return Math.floor(n/60)+'分'+String(n%60).padStart(2,'0')+'秒'}function tap(ok=true){s.taps++;if(!ok)s.miss++;save()}function base(body){app.innerHTML='<section class="panel">'+body+'</section>'}function btn(label,fn,cls=''){return `<button class="btn ${cls}" onclick='${fn}'>${label}</button>`}function msg(t){let e=document.getElementById('msg');if(e)e.textContent=t}function start(mode){s={stage:1,taps:0,miss:0,started:Date.now(),stageStarted:Date.now(),log:[],banana:0,tries:0,clues:[],king:0,finish:false,mode};save();render()}function next(){s.log.push({stage:s.stage,seconds:Math.round((Date.now()-s.stageStarted)/1000),miss:s.miss});s.stage++;s.stageStarted=Date.now();s.tries=0;save();render()}function wrong(t){tap(false);msg(t)}function render(){clearInterval(timer);if(s.stage===0){base(`<h1 class="title">何しに来たん。</h1><div class="big">🦆❓</div><p class="sub">目的を探してたら<br>目的に逃げられました。</p>${btn('遊びに来た','start("normal")')}${btn('横で反応を観察する 😎','start("observe")','alt')}<p class="muted center">全7ステージ｜約3〜7分｜音なしでも遊べる</p><p class="muted center">※観察モードも記録はこの端末だけ。遠隔監視はしません。</p>`);return}if(s.stage===8){result();return}let head=`<div class="stage">STAGE ${s.stage} / 7</div><div id="msg" class="message">${['','バナナ、捕まえられる？','出口を探せ。','おにぎりを弁護せよ。','10秒を盗め。','じゃがいもの秘密。','王様を辞めさせろ。','このゲームを終わらせろ。'][s.stage]}</div>`;switch(s.stage){case 1:base(head+`<div class="question">逃げるバナナを3回タップ</div><div class="arena" id="arena"><button class="runner" id="banana" style="left:38%;top:25%" onclick="bananaTap()">🍌</button></div><p class="hint">追いかけるだけ。人生みたいなもんや。</p>`);break;case 2:base(head+`<div class="question">正しいドアを選べ</div><div class="row">${btn('🚪 赤','door()')}${btn('🚪 青','door()')}${btn('🚪 黄','door()')}</div><p class="center"><button class="ghost" onclick="tap();next()">帰る</button></p><p class="hint">正しいドアとは言うてへん。</p>`);break;case 3:base(head+`<div class="big">🍙⚖️</div><div class="question">罪状：勝手に三角形になった</div><p class="center">証拠を2つ集めて無罪を主張せよ</p>${btn('海苔を調べる','clue("海苔")')}${btn('米を調べる','clue("米")')}${btn('梅干しを尋問','clue("梅干し")','alt')}${btn('異議あり！','defend()','dark')}`);break;case 4:base(head+`<div class="question">時計から「10」を盗め</div><div class="big">⏰</div><div class="row">${btn('8','wrong("それ8や。落ち着け。")')}${btn('10','tap();next()')}${btn('12','wrong("惜しいと言いたいが違う。")')}</div><p class="hint">数字は普通に押せる。疑いすぎや。</p>`);break;case 5:base(head+`<div class="big">🥔</div><div class="question">じゃがいもの体重は？</div><p class="center">ヒント：体重を誰にも教えたくないらしい</p>${btn('3kg','wrong("勝手に体重を公開すな！")')}${btn('秘密','tap();next()')}${btn('昨日より軽い','wrong("昨日の体重、知らんやろ。")')}`);break;case 6:base(head+`<div class="big">🦆👑</div><div class="question">アヒル王を退位させよ</div>${btn('王様、辞めてください','askKing()')}${s.king>=3?btn('王冠をペンギンに渡す 🐧','tap();next()','alt'):''}<p class="hint">王様には3回お願いしてみよう。</p>`);break;case 7:base(head+`<div class="question">ゲームを終了せよ</div><div class="big">🏁</div>${btn('終了','wrong("そのボタン、今日は休みや。")')}${btn('やめる','wrong("ほんまに？ でも違うで。")','alt')}<p class="center">タイトルを長押ししてみ？</p><div class="message" id="longPress">何しに来たん。</div><p class="hint">約1.2秒押したままにしてな。</p>`);let e=document.getElementById('longPress');function down(ev){ev.preventDefault();clearTimeout(pressTimer);pressTimer=setTimeout(()=>{tap();next()},1200)}function up(){clearTimeout(pressTimer)}e.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(k=>e.addEventListener(k,up));break}if(s.mode==='observe')app.querySelector('.panel').insertAdjacentHTML('beforeend','<p class="hint">👀 観察モード中（結果画面で内訳を表示）</p>')}
function bananaTap(){tap();s.banana++;let b=document.getElementById('banana');if(s.banana>=3){msg('ワシ、キュウリやけど？');b.textContent='🥒';save();setTimeout(next,850)}else{b.style.left=Math.floor(5+Math.random()*70)+'%';b.style.top=Math.floor(5+Math.random()*55)+'%';msg(s.banana===1?'逃げた！ 逃げた！':'必死すぎるやろ🤣');save()}}function door(){wrong('ドアを選べとは言うた。でも正解がドアとは言うてへん。')}function clue(x){tap();if(!s.clues.includes(x))s.clues.push(x);msg(x==='海苔'?'海苔「巻かれただけです」':x==='米'?'米「集まっただけです」':'梅干し「真ん中におっただけや」');save()}function defend(){if(s.clues.length>=2){tap();msg('無罪！ ただし本人は昔、丸かったらしい。');setTimeout(next,1000)}else wrong('証拠が足りん。まず調べよ。')}function askKing(){tap();s.king++;msg(['','嫌や。','断る。','ほな、お前が王様な。王冠を誰かに渡せ。'][Math.min(s.king,3)]);save();if(s.king>=3)renderKing()}function renderKing(){let e=document.getElementById('msg');render();msg('ほな、お前が王様な。王冠を誰かに渡せ。')}
function result(){s.finish=true;save();let secs=elapsed(),rank=s.miss>=7?'迷走界のレジェンド':s.taps>=25?'無駄な努力の天才':'なんでやねん特別賞';base(`<div class="center"><span class="pill">公式認定</span><div class="big">🏆</div><h1 class="title" style="font-size:31px">無駄な努力認定証</h1><h2>${rank}</h2><p>あんた、よう頑張ったな。<br>何を頑張ったかは知らんけど。</p></div><div class="stats"><div class="stat">総タップ<br><b>${s.taps}回</b></div><div class="stat">迷走時間<br><b>${fmt(secs)}</b></div><div class="stat">ミス<br><b>${s.miss}回</b></div><div class="stat">完走<br><b>7/7</b></div></div>${btn('認定証をPNG保存','downloadCertificate()')}${btn('結果をシェアする','shareResult()','alt')}${s.mode==='observe'?btn('👀 観察記録を見る','showObserve()','dark'):''}${btn('もう一回、時間を無駄にする','reset()','dark')}<p class="muted center">スクショをうめこに送りつけてもええで🤣</p><div id="details"></div>`)}function showObserve(){let d=document.getElementById('details');d.innerHTML='<div class="message">観察記録（この端末のみ）</div>'+s.log.map(x=>`<p class="muted">STAGE ${x.stage}：約${x.seconds}秒</p>`).join('')+'<p class="muted">※ステージ別のミス回数は未計測。合計ミス数は上に表示。</p>'}function reset(){try{localStorage.removeItem(KEY)}catch(e){}s.stage=0;s.started=0;render()}function certificateCanvas(){let c=document.getElementById('certificate'),g=c.getContext('2d'),w=c.width;g.fillStyle='#26183e';g.fillRect(0,0,w,1440);g.fillStyle='#fff9e9';g.fillRect(65,70,950,1300);g.strokeStyle='#d9a33e';g.lineWidth=12;g.strokeRect(95,100,890,1240);g.textAlign='center';g.fillStyle='#38264c';g.font='bold 44px sans-serif';g.fillText('何しに来たん。',540,230);g.font='105px sans-serif';g.fillText('🏆',540,410);g.font='bold 76px sans-serif';g.fillText('無駄な努力認定証',540,550);g.font='bold 49px sans-serif';let rank=s.miss>=7?'迷走界のレジェンド':s.taps>=25?'無駄な努力の天才':'なんでやねん特別賞';g.fillText(rank,540,675);g.font='38px sans-serif';g.fillText('あんた、よう頑張ったな。',540,790);g.fillText('何を頑張ったかは知らんけど。',540,855);g.font='bold 42px sans-serif';g.fillText(`タップ ${s.taps}回　ミス ${s.miss}回`,540,1000);g.fillText(`迷走時間 ${fmt(elapsed())}`,540,1070);g.font='32px sans-serif';g.fillText('うめこアプリ工房　公式認定',540,1230);return c}function downloadCertificate(){tap();const c=certificateCanvas();c.toBlob(blob=>{if(!blob){alert('画像の生成に失敗しました');return}let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='何しに来たん_無駄な努力認定証.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)},'image/png')}async function shareResult(){tap();let text=`『何しに来たん。』完走🤣\nタップ${s.taps}回／ミス${s.miss}回／${fmt(elapsed())}\n${location.href}`;try{if(navigator.share)await navigator.share({title:'何しに来たん。',text,url:location.href});else if(navigator.clipboard){await navigator.clipboard.writeText(text);alert('結果をコピーしたで！')}else prompt('結果をコピーしてな',text)}catch(e){if(e.name!=='AbortError')prompt('結果をコピーしてな',text)}}load();if(s.stage>0&&s.stage<8){s.stageStarted=Date.now();if(!s.started)s.started=Date.now()}render();</script></body></html>
