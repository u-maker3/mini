<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#21152d"><title>何しに来たん。</title><link rel="apple-touch-icon" sizes="180x180" href="./KURO.PNG?v=3"><link rel="icon" type="image/png" href="./KURO.PNG?v=3"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="何しに来たん"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>
*{box-sizing:border-box}body{margin:0;background:#21152d;color:white;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;text-align:center}.wrap{max-width:520px;margin:auto;padding:16px 14px 28px}h1{font-size:clamp(28px,8vw,42px);margin:20px 0 5px}.sub{color:#e5c9ee;margin:0 0 20px}.panel{background:#352444;border:2px solid #70517e;border-radius:24px;padding:19px;margin:12px 0}.note{line-height:1.8}.small{font-size:13px;color:#d4c1dc}.primary,.secondary{font:inherit;cursor:pointer;touch-action:manipulation}.primary{border:0;border-radius:18px;padding:18px;background:#ffda52;color:#291525;font-size:22px;font-weight:900;width:100%;margin:12px 0}.secondary{background:#594069;border:1px solid #a98cba;color:white;border-radius:13px;padding:12px 16px;margin:6px}.hidden{display:none!important}.stats{display:flex;gap:8px;margin:10px 0}.stat{flex:1;background:#493356;border-radius:13px;padding:9px 3px}.stat strong{display:block;font-size:24px}.stat span{font-size:12px}.bar{height:10px;background:#6d557a;border-radius:99px;overflow:hidden}.bar div{height:100%;background:#ffda52;width:100%}.toast{min-height:43px;color:#ffe17c;font-weight:bold;margin:10px 0}.arena{position:relative;height:min(55vh,420px);min-height:320px;border:3px solid #ffda52;border-radius:20px;background:radial-gradient(circle,#5a3d70,#2a1a38);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}.phase{position:absolute;top:12px;left:4px;right:4px;font-size:15px;font-weight:900;pointer-events:none}.character{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:94px;height:112px;padding:0;border:0;background:transparent;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;filter:drop-shadow(0 4px 4px #0009)}.character img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}.character.fake{opacity:.43;filter:grayscale(1) drop-shadow(0 4px 4px #0009)}.character.boss{width:140px;height:156px}.character:active{filter:brightness(1.4) drop-shadow(0 3px 8px #ffe17c)}.footer{font-size:12px;color:#baa7c5;margin-top:22px}#certificate{display:block;width:100%;max-width:none;border-radius:8px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
</style></head><body><div class="wrap"><h1>何しに来たん。</h1><p class="sub">〜帰りたいだけやのに。〜</p><section id="intro" class="panel"><div style="font-size:60px">🚪🏃💨</div><h2>30秒で帰れると思うなよ。</h2><p class="note">逃げ回るキャラをタップして捕まえろ！<br>第2ステージから半透明のニセモノ出現！<br>最後はボスを連打で追い払え🤣</p><button class="primary" id="start">帰らせてくれ！</button><p class="small">音なし・何回でも挑戦できるで</p></section><section id="game" class="hidden"><div class="stats"><div class="stat"><strong id="time">30.0</strong><span>残り秒</span></div><div class="stat"><strong id="score">0</strong><span>得点</span></div><div class="stat"><strong id="hits">0</strong><span>捕獲</span></div><div class="stat"><strong id="miss">0</strong><span>ミス</span></div></div><div class="bar"><div id="timebar"></div></div><p class="toast" id="toast">捕まえてみぃ！</p><div class="arena" id="arena"><div class="phase" id="phase"></div></div><button class="secondary" id="quit">やっぱりやめる</button></section><section id="result" class="panel hidden"><div style="font-size:50px">🏆</div><h2 style="color:#ffda52">無駄な努力認定証</h2><h3 id="rank"></h3><p class="note" id="summary"></p><p class="small" id="best"></p><button class="primary" id="save">📸 認定証をもう一度表示</button><button class="secondary" id="retry">もう一回しばく</button><button class="secondary" id="home">最初に戻る</button><div id="imagewrap" class="hidden" style="margin:16px -14px 0"><img id="certificate" alt="認定証"></div><p id="savehint" class="small"></p></section><p class="footer">うめこアプリ工房｜このゲームに意味はありません。</p></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),arena=$('arena');const files=['KINOKO.PNG','KABOCHA.PNG','KURO.PNG','BOSS.PNG'],emoji=['🍄','🎃','🕶️','👑'];let active=false,begin=0,frame=0,moveTimer=0,phase=-1,items=[],score=0,hits=0,miss=0,bossHits=0,lastResult=null;const DURATION=30000;function show(id){['intro','game','result'].forEach(k=>$(k).classList.toggle('hidden',k!==id))}function say(t){$('toast').textContent=t}function clearItems(){items.forEach(x=>x.remove());items=[]}function update(){ $('score').textContent=score;$('hits').textContent=hits;$('miss').textContent=miss}function rand(a,b){return a+Math.random()*(b-a)}function position(el){const w=arena.clientWidth,h=arena.clientHeight,ew=el.offsetWidth||94,eh=el.offsetHeight||112;el.style.left=rand(ew/2+5,Math.max(ew/2+6,w-ew/2-5))+'px';el.style.top=rand(eh/2+45,Math.max(eh/2+46,h-eh/2-6))+'px'}function make(fake,boss){const el=document.createElement('button');el.type='button';el.className='character'+(fake?' fake':'')+(boss?' boss':'');el.setAttribute('aria-label',fake?'ニセモノ':'捕まえる');const n=boss?3:Math.min(phase,2),im=document.createElement('img');im.alt='';im.src='./'+files[n];im.onerror=()=>{im.remove();el.textContent=emoji[n];el.style.fontSize='65px'};el.appendChild(im);arena.appendChild(el);items.push(el);position(el);el.addEventListener('click',e=>{e.stopPropagation();if(!active)return;if(fake){miss++;score=Math.max(0,score-5);say('ニセモノや！ −5点🤣');position(el)}else{hits++;score+=10;if(boss){bossHits++;el.style.transform='translate(-50%,-50%) scale('+Math.max(.38,1-bossHits*.09)+')';say(bossHits>=7?'ボス「さいなら〜！」💨':'ボス「やめろやー！」');if(bossHits>=7){bossHits=0;el.style.transform='translate(-50%,-50%)';position(el)}}else{say(['捕まったー！','やるやん！','必死やな🤣','逃がさんぞ！'][hits%4]);position(el)}}update()});return el}function setPhase(p){if(p===phase)return;phase=p;clearItems();bossHits=0;const labels=['LEVEL 1｜きのこ','LEVEL 2｜かぼちゃ＋ニセモノ','LEVEL 3｜黒ずくめ＋ニセモノ','LEVEL 4｜ニセモノ大量発生','FINAL｜金ピカボス'];$('phase').textContent=labels[p];if(p===4){make(false,true);say('ボスを7回叩いて追い払え！')}else{make(false,false);const fakeCount=[0,1,2,4][p];for(let i=0;i<fakeCount;i++)make(true,false);say(p===0?'きのこを捕まえろ！':'半透明は押したらあかん！')}}function move(){if(!active)return;items.forEach(el=>{if(Math.random()<.75)position(el)})}function tick(){if(!active)return;const left=Math.max(0,DURATION-(performance.now()-begin));$('time').textContent=(left/1000).toFixed(1);$('timebar').style.width=left/DURATION*100+'%';const elapsed=DURATION-left;setPhase(elapsed<6000?0:elapsed<12000?1:elapsed<18000?2:elapsed<24000?3:4);if(left<=0){finish();return}frame=requestAnimationFrame(tick)}function stop(){active=false;cancelAnimationFrame(frame);clearInterval(moveTimer);clearItems()}function start(){stop();score=hits=miss=bossHits=0;phase=-1;update();$('time').textContent='30.0';$('timebar').style.width='100%';$('imagewrap').classList.add('hidden');$('savehint').textContent='';show('game');active=true;begin=performance.now();setPhase(0);moveTimer=setInterval(move,600);frame=requestAnimationFrame(tick)}function finish(){if(!active)return;stop();const rank=score>=500?'指先だけアスリート':score>=250?'帰宅への執念が強すぎる人':score>=100?'まあまあ帰りたい人':'まだ玄関にも着いてへん人';$('rank').textContent=rank;$('summary').innerHTML='捕獲 <b>'+hits+'</b> 回 ／ ミス <b>'+miss+'</b> 回<br>得点 <b>'+score+'</b> 点<br><br>帰りたかっただけやのに。';let best=0;try{best=Number(localStorage.getItem('nanishini_best')||0);if(score>best){best=score;localStorage.setItem('nanishini_best',String(best))}}catch(e){}$('best').textContent='自己ベスト：'+best+'点';lastResult={rank,score,hits,miss};show('result');save()}function save(){if(!lastResult)return;try{const r=lastResult,c=document.createElement('canvas');c.width=900;c.height=1200;const x=c.getContext('2d');x.fillStyle='#261631';x.fillRect(0,0,900,1200);x.strokeStyle='#ffda52';x.lineWidth=14;x.strokeRect(35,35,830,1130);x.textAlign='center';x.fillStyle='#ffda52';x.font='bold 65px sans-serif';x.fillText('無駄な努力認定証',450,200);x.fillStyle='white';x.font='bold 48px sans-serif';x.fillText('何しに来たん。',450,300);x.font='bold 38px sans-serif';x.fillText(r.rank,450,440);x.font='43px sans-serif';x.fillText('捕獲：'+r.hits+' 回',450,565);x.fillText('ミス：'+r.miss+' 回',450,645);x.fillText('得点：'+r.score+' 点',450,725);x.font='33px sans-serif';x.fillText('帰りたかっただけやのに。',450,850);x.fillStyle='#dfc5e7';x.font='27px sans-serif';x.fillText('うめこアプリ工房',450,1060);const url=c.toDataURL('image/png');$('certificate').src=url;$('imagewrap').classList.remove('hidden');$('savehint').textContent='';$('imagewrap').scrollIntoView({behavior:'smooth',block:'nearest'})}catch(e){$('savehint').textContent='画像を作れへんかった：'+e.message}}$('start').addEventListener('click',start);$('retry').addEventListener('click',start);$('quit').addEventListener('click',finish);$('home').addEventListener('click',()=>{stop();show('intro')});$('save').addEventListener('click',save);arena.addEventListener('click',e=>{if(active&&e.target===arena){miss++;score=Math.max(0,score-5);update();say('空振り！ −5点')}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&active)finish()});show('intro')})();
</script></body></html>
