<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#24163c"><title>何しに来たん。｜うめこ</title><style>
*{box-sizing:border-box}body{margin:0;background:#24163c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif}.wrap{max-width:550px;margin:auto;padding:20px 16px 40px}.brand{text-align:center;color:#e8c5f7;font-size:12px;letter-spacing:.12em}.panel{background:#fff9ed;color:#322441;border:3px solid #120d20;border-radius:23px;padding:20px 16px;box-shadow:6px 7px #100a1c;margin-top:18px}h1{font-size:clamp(30px,9vw,46px);text-align:center;margin:12px 0}h2{text-align:center;font-size:23px}.center{text-align:center}.emoji{font-size:75px;text-align:center;margin:15px 0}.msg{background:#eee4fa;border-radius:12px;padding:14px;text-align:center;line-height:1.6;font-weight:700;margin:12px 0}.btn{display:block;width:100%;padding:15px 10px;margin:11px 0;border:3px solid #251831;border-radius:15px;background:#ffe078;color:#261c31;font-size:18px;font-weight:800;box-shadow:3px 3px #251831;touch-action:manipulation;cursor:pointer}.btn.alt{background:#f9d4e5}.btn.dark{background:#44305d;color:white}.btn:active{transform:translate(2px,2px)}.muted{font-size:13px;color:#6f6078;text-align:center;line-height:1.7}.stage{font-size:13px;font-weight:800;color:#765587}.arena{height:220px;border:2px dashed #bba6cb;border-radius:14px;background:white;position:relative;overflow:hidden}.runner{position:absolute;font-size:56px;background:transparent;border:0;touch-action:manipulation;cursor:pointer}.row{display:flex;gap:6px}.row .btn{font-size:15px}.small{font-size:13px;color:#6d5874;text-align:center}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;background:#efe7fa;border-radius:12px;text-align:center}.stat b{font-size:23px}.exit{display:block;text-align:center;padding:12px;color:#7a6586;text-decoration:underline;border:0;background:transparent;width:100%;font-size:14px}.press{touch-action:none;user-select:none;-webkit-user-select:none;border:3px dashed #aa80bb;border-radius:12px;padding:25px;text-align:center;font-weight:900;font-size:25px;background:#f0e2fa}#certificate{display:none}.footer{font-size:12px;text-align:center;color:#d5bbde;margin-top:22px}</style></head><body><div class="wrap"><div class="brand">UMEKO PRESENTS ・ 理解したら負け</div><main id="app"></main><div class="footer">遊びの記録はこの端末内だけ</div></div><canvas id="certificate" width="1080" height="1440"></canvas><script>
(()=>{'use strict';
const app=document.getElementById('app');const KEY='umeko_nanishini_v5';
let state={stage:0,mode:'normal',taps:0,miss:0,started:0,stageStarted:0,stageMiss:0,records:[],banana:0,clues:[],king:0,locked:false};let pending=null,hold=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function clearPending(){if(pending!==null){clearTimeout(pending);pending=null}if(hold!==null){clearTimeout(hold);hold=null}}
function button(text,action,style=''){return `<button type="button" class="btn ${style}" data-action="${action}">${text}</button>`}
function page(content){app.innerHTML=`<section class="panel">${content}</section>`}
function message(text){const e=document.getElementById('message');if(e)e.textContent=text}
function count(isMiss=false){state.taps++;if(isMiss){state.miss++;state.stageMiss++}save()}
function mistake(text){count(true);message(text)}
function begin(mode){clearPending();state={stage:1,mode,taps:0,miss:0,started:Date.now(),stageStarted:Date.now(),stageMiss:0,records:[],banana:0,clues:[],king:0,locked:false};save();render()}
function advance(){if(state.locked)return;state.locked=true;clearPending();state.records.push({stage:state.stage,seconds:Math.floor((Date.now()-state.stageStarted)/1000),miss:state.stageMiss});state.stage++;state.stageStarted=Date.now();state.stageMiss=0;state.locked=false;save();render()}
function laterAdvance(text,delay=650){if(state.locked)return;state.locked=true;message(text);save();pending=setTimeout(()=>{pending=null;state.locked=false;advance()},delay)}
function seconds(){return Math.max(0,Math.floor((Date.now()-state.started)/1000))}function duration(n){return Math.floor(n/60)+'分'+String(n%60).padStart(2,'0')+'秒'}
function render(){clearPending();let n=state.stage;if(n===0){page(`<h1>何しに来たん。</h1><div class="emoji">🦆❓</div><p class="center">目的を探してたら、目的に逃げられました。</p>${button('遊びに来た','start')}${button('👀 横で反応を観察する','observe','alt')}<p class="muted">全7ステージ。どっちも同じゲームやで。</p>`);return}if(n===8){result();return}
const names=['','バナナ、捕まえられる？','出口を探せ。','おにぎりを弁護せよ。','10秒を盗め。','じゃがいもの秘密。','王様を辞めさせろ。','ゲームを終わらせろ。'];let content=`<div class="stage">STAGE ${n} / 7</div><div class="msg" id="message">${names[n]}</div>`;
if(n===1)content+=`<h2>バナナを3回タップ！</h2><div class="arena" id="arena"><button type="button" class="runner" data-action="banana" style="left:38%;top:28%">🍌</button></div><p class="small">走るバナナ。何のために。</p>`;
if(n===2)content+=`<h2>正しいドアを選べ</h2><div class="row">${button('🚪 赤','door')}${button('🚪 青','door')}${button('🚪 黄','door')}</div><button type="button" class="btn dark" data-action="exit">🚪 帰る（次のステージへ）</button><p class="small">ドアを3回間違えても次へ進めるで。</p>`;
if(n===3)content+=`<div class="emoji">🍙⚖️</div><h2>罪状：勝手に三角形になった</h2><p class="center">証拠を2種類集めて弁護せよ</p>${button('海苔を調べる','nori')}${button('米を調べる','rice')}${button('梅干しを尋問','plum','alt')}${button('異議あり！','defend','dark')}`;
if(n===4)content+=`<div class="emoji">⏰</div><h2>時計から「10」を盗め</h2><div class="row">${button('8','eight')}${button('10','ten')}${button('12','twelve')}</div><p class="small">素直に押してええんやで。</p>`;
if(n===5)content+=`<div class="emoji">🥔</div><h2>じゃがいもの体重は？</h2><p class="center">ヒント：本人は誰にも教えたくないらしい</p>${button('3kg','weight3')}${button('秘密','secret')}${button('昨日より軽い','weightYesterday')}`;
if(n===6)content+=`<div class="emoji">🦆👑</div><h2>アヒル王を退位させよ</h2>${button('王様、辞めてください','ask')}${state.king>=3?button('王冠をペンギンに渡す 🐧','crown','alt'):''}<p class="small">3回お願いしてみよ。</p>`;
if(n===7)content+=`<div class="emoji">🏁</div><h2>ゲームを終了せよ</h2>${button('終了','fakeEnd')}${button('やめる','fakeQuit','alt')}<p class="small">下のタイトルを約1.2秒長押ししてみ？</p><div class="press" id="press">何しに来たん。</div>`;
if(state.mode==='observe')content+='<p class="small">👀 観察モード：終了後にステージ別記録を表示</p>';page(content);
}
function result(){const rank=state.miss>=7?'迷走界のレジェンド':state.taps>=25?'無駄な努力の天才':'なんでやねん特別賞';page(`<div class="emoji">🏆</div><h1 style="font-size:32px">無駄な努力認定証</h1><h2>${rank}</h2><p class="center">あんた、よう頑張ったな。<br>何を頑張ったかは知らんけど。</p><div class="stats"><div class="stat">タップ<br><b>${state.taps}回</b></div><div class="stat">ミス<br><b>${state.miss}回</b></div><div class="stat">迷走時間<br><b>${duration(seconds())}</b></div><div class="stat">完走<br><b>7 / 7</b></div></div>${button('認定証をPNG保存','png')}${button('結果をシェア','share','alt')}${state.mode==='observe'?button('👀 観察記録を見る','records','dark'):''}${button('もう一回遊ぶ','restart','dark')}<div id="details"></div><p class="muted">結果をスクショして送ってもええで🤣</p>`)}
function drawPng(){const c=document.getElementById('certificate'),g=c.getContext('2d');g.fillStyle='#25173c';g.fillRect(0,0,1080,1440);g.fillStyle='#fff9ed';g.fillRect(60,70,960,1300);g.strokeStyle='#bb8d38';g.lineWidth=10;g.strokeRect(90,100,900,1240);g.fillStyle='#322441';g.textAlign='center';g.font='bold 54px sans-serif';g.fillText('何しに来たん。',540,240);g.font='bold 68px sans-serif';g.fillText('無駄な努力認定証',540,480);g.font='bold 48px sans-serif';g.fillText(state.miss>=7?'迷走界のレジェンド':state.taps>=25?'無駄な努力の天才':'なんでやねん特別賞',540,640);g.font='40px sans-serif';g.fillText('あんた、よう頑張ったな。',540,810);g.fillText('何を頑張ったかは知らんけど。',540,875);g.fillText(`タップ ${state.taps}回　ミス ${state.miss}回`,540,1050);g.fillText(`迷走時間 ${duration(seconds())}`,540,1120);g.font='32px sans-serif';g.fillText('うめこアプリ工房',540,1270);return c}
function png(){try{const a=document.createElement('a');a.href=drawPng().toDataURL('image/png');a.download='何しに来たん_認定証.png';document.body.appendChild(a);a.click();a.remove()}catch(e){alert('画像保存ができへんかった。スクショで保存してな。')}}
async function share(){const txt=`『何しに来たん。』完走！ タップ${state.taps}回、ミス${state.miss}回。 ${location.href}`;try{if(navigator.share)await navigator.share({text:txt});else if(navigator.clipboard){await navigator.clipboard.writeText(txt);alert('コピーしたで！')}else window.prompt('コピーしてな',txt)}catch(e){if(e.name!=='AbortError')window.prompt('コピーしてな',txt)}}
const handlers={start:()=>begin('normal'),observe:()=>begin('observe'),banana:()=>{count();state.banana++;if(state.banana>=3){laterAdvance('ワシ、キュウリやけど？ 🥒',800)}else{const b=app.querySelector('.runner');b.style.left=(5+Math.floor(Math.random()*65))+'%';b.style.top=(5+Math.floor(Math.random()*55))+'%';message('逃げた！ 必死すぎるやろ🤣')}save()},door:()=>{count(true);if(state.stageMiss>=3){laterAdvance('ドアが根負けした！ 強引に突破や🤣',650)}else{message('そこちゃうで！ 下の「帰る」が本当の出口や。あと'+(3-state.stageMiss)+'回ドアを押しても突破できるで。')}},exit:()=>{count();advance()},nori:()=>clue('海苔','巻かれただけです'),rice:()=>clue('米','集まっただけです'),plum:()=>clue('梅干し','真ん中におっただけや'),defend:()=>{if(state.clues.length<2)mistake('証拠が足りんで。');else{count();laterAdvance('無罪！ でも昔は丸かったらしい。')}},eight:()=>mistake('それ8や。'),ten:()=>{count();advance()},twelve:()=>mistake('それ12や。'),weight3:()=>mistake('勝手に体重公開すな！'),secret:()=>{count();advance()},weightYesterday:()=>mistake('昨日の体重知らんやろ。'),ask:()=>{count();state.king=Math.min(3,state.king+1);save();if(state.king===3){render();message('ほな、お前が王様な。王冠を渡せ。')}else message(state.king===1?'嫌や。':'断る。')},crown:()=>{count();advance()},fakeEnd:()=>mistake('そのボタン今日は休みや。'),fakeQuit:()=>mistake('ほんまに？ でも違うで。'),png,share,records:()=>{document.getElementById('details').innerHTML='<h2>観察記録</h2>'+state.records.map(r=>`<p class="small">ステージ${r.stage}：${r.seconds}秒・ミス${r.miss}回</p>`).join('')},restart:()=>{clearPending();state.stage=0;save();render()}};
function clue(name,quote){count();if(!state.clues.includes(name))state.clues.push(name);message(name+'「'+quote+'」');save()}
app.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||!app.contains(b)||state.locked)return;const fn=handlers[b.dataset.action];if(fn)fn()});
app.addEventListener('pointerdown',e=>{if(e.target.id!=='press'||state.stage!==7||state.locked)return;e.preventDefault();clearTimeout(hold);hold=setTimeout(()=>{hold=null;count();laterAdvance('終了成功！ 何しに来たん？',300)},1200)});
['pointerup','pointercancel','pointerleave'].forEach(name=>app.addEventListener(name,e=>{if(e.target.id==='press'){clearTimeout(hold);hold=null}}));
// 安全のため更新時は最初の画面へ。前のプレイのタイマーやステージを復元しない。
render();
})();</script></body></html>
